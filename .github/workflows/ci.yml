name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  api:
    name: API (lint, build, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unify
          POSTGRES_PASSWORD: unify_password
          POSTGRES_DB: unify_club_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://unify:unify_password@localhost:5432/unify_club_crm_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NOTIFICATION_EMAIL_PROVIDER: console
      NOTIFICATION_WHATSAPP_PROVIDER: console
      NOTIFICATION_PUSH_PROVIDER: console
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: ./uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: Build
        working-directory: apps/api
        run: npm run build

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Unit tests
        working-directory: apps/api
        run: npm test -- --ci

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build
